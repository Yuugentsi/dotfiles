# core

confirm_os_window_close 0
sync_to_monitor yes
enable_audio_bell no
linux_display_server wayland
wayland_enable_ime no
font_size 12.0

# performance

repaint_delay 4
input_delay 0

# url

url_color #91d7e3
url_style curly
open_url_with default
detect_urls yes
underline_hyperlinks hover

# clipboard

copy_on_select yes
map ctrl+v paste_from_clipboard
map ctrl+c copy_and_clear_or_interrupt

# navigation

map ctrl+t new_tab
map ctrl+w close_tab
map ctrl+right next_tab
map ctrl+left previous_tab

# scroll

map ctrl+up scroll_line_up
map ctrl+down scroll_line_down
map ctrl+page_up scroll_page_up
map ctrl+page_down scroll_page_down

# zoom

map ctrl+equal change_font_size all +2.0
map ctrl+plus change_font_size all +2.0
map ctrl+minus change_font_size all -2.0
map ctrl+0 change_font_size all 0

# fonts

font_family JetBrainsMono Nerd Font
bold_font JetBrainsMono Nerd Font Bold
italic_font JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic

font_features JetBrainsMonoNF-Regular +liga +calt
font_features JetBrainsMonoNF-Bold +liga +calt
modify_font cell_height 115%
modify_font underline_position 2
modify_font underline_thickness 150%
undercurl_style thin-sparse

# cursor

cursor #f5bde6
cursor_text_color #18151f
cursor_shape beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0
cursor_trail 0
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# window

window_padding_width 14 18
hide_window_decorations yes
draw_minimal_borders yes
window_border_width 1px
active_border_color #b7a0e5
inactive_border_color #34303e

# tabs

tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style round
tab_bar_align center
tab_bar_min_tabs 2
tab_bar_margin_width 12
tab_bar_margin_height 6 6
tab_title_template " {index}  {title} "
tab_activity_symbol none
bell_on_tab no

active_tab_foreground #201a2a
active_tab_background #c4a7e7
active_tab_font_style bold
inactive_tab_foreground #b2a5c2
inactive_tab_background #2a2435
tab_bar_background #18151f

# colors

foreground #e8e1f0
background #18151f
background_opacity 0.92
background_blur 15

selection_foreground #f5efff
selection_background #514262

color0 #292433
color1 #ed8796
color2 #a6da95
color3 #eed49f
color4 #8aadf4
color5 #c6a0f6
color6 #8bd5ca
color7 #d9d1e3

color8 #786b88
color9 #f5a5b3
color10 #bce6a8
color11 #f5dfb5
color12 #a7c1ff
color13 #d7b8ff
color14 #a2e3da
color15 #f5efff

# misc

map alt+enter new_window_with_cwd
map alt+c close_tab

allow_remote_control yes
listen_on unix:/tmp/kitty_socket
